services:
  # ====== n8n WEB (MAIN) ======
  n8n-web:
    image: n8nio/n8n:latest
    container_name: n8n-web
    restart: always
    environment:
      # Modo Queue
      EXECUTIONS_MODE: ${EXECUTIONS_MODE:-queue}
      QUEUE_BULL_REDIS_HOST: ${QUEUE_BULL_REDIS_HOST:-redis}
      QUEUE_BULL_REDIS_PORT: ${QUEUE_BULL_REDIS_PORT:-6379}
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-5}
      QUEUE_BULL_REDIS_PASSWORD: ${QUEUE_BULL_REDIS_PASSWORD}
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-2000}
      # esto es para que las ejecuciones manuales también se vayan a los workers, si no, se quedarán en el web y no escalarán, pero lo dejamos configurable por si alguien quiere el comportamiento antiguo
      N8N_DISABLE_MANUAL_EXECUTIONS_TO_WORKERS: ${N8N_DISABLE_MANUAL_EXECUTIONS_TO_WORKERS:-false}
      # asegúrate que esté en false para que las ejecuciones manuales también se vayan a los workers, si no, se quedarán en el web y no escalarán
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: ${OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS}
      # Base de datos compartida
      DB_TYPE: ${DB_TYPE:-postgresdb}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:- postgres}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}


      # Configuración de Red (IMPORTANTE para Cloudflare)
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https} # Cloudflare siempre es https
      NODE_ENV: ${NODE_ENV:-production}
      # Quitamos el puerto de la URL del webhook porque Cloudflare usa el 443 estándar
      WEBHOOK_URL: ${WEBHOOK_URL}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DATA_FOLDER: ${DATA_FOLDER:-/home/node/.n8n}

      # ====== CONFIGURACIÓN DE VAULT (DINÁMICA) ======
      N8N_EXTERNAL_SECRETS_DEFAULT_PROVIDER: ${N8N_EXTERNAL_SECRETS_DEFAULT_PROVIDER}
      N8N_VAULT_AUTH_TYPE: ${N8N_VAULT_AUTH_TYPE}
      N8N_VAULT_SERVER_URL: ${N8N_VAULT_SERVER_URL}
      N8N_VAULT_AUTH_ROLE_ID: ${N8N_VAULT_AUTH_ROLE_ID}
      N8N_VAULT_AUTH_SECRET_ID: ${N8N_VAULT_AUTH_SECRET_ID}
      N8N_VAULT_AUTH_PATH: ${N8N_VAULT_AUTH_PATH}

      # ====== CONFIGURACIÓN DE MINIO (S3) ======

      # Variables para los NODOS de n8n
      N8N_S3_ADDRESS: ${N8N_S3_ADDRESS}
      N8N_S3_PORT: ${N8N_S3_PORT}
      N8N_S3_BUCKET_NAME: ${N8N_S3_BUCKET_NAME}
      N8N_S3_ACCESS_KEY: ${N8N_S3_ACCESS_KEY}
      N8N_S3_SECRET_KEY: ${N8N_S3_SECRET_KEY}
      N8N_S3_REGION: ${N8N_S3_REGION}

      # ====== CONFIGURACIÓN PARA EL PROXY DE NGINX ======

      # Intento de modo automático (Solo si tienes licencia, si no, n8n lo ignora)
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-false}

      # IMPORTANTE para Cloudflare, confía en los headers de proxy para IP real y protocolo
      TZ: ${TZ:-America/Bogota}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      # De paso arreglamos el error de X-Forwarded-For que vimos en el log
      N8N_TRUST_PROXY: ${N8N_TRUST_PROXY:-true}
      # Si tienes múltiples proxies (ejemplo: Cloudflare + Nginx propio), ajusta el número de hops para confiar en los headers correctamente, el valor 2 es común para esta configuración
      N8N_TRUST_PROXY_HOPS: ${N8N_TRUST_PROXY_HOPS:-2}
      # vault ui (opcional, sólo para desarrollo o si quieres usar vault ui en el mismo contenedor, no recomendado para producción)
    volumes:
      - ./volumes/n8n-data:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Acceso HTTP (público y Tailscale)
      - "127.0.0.1:5678:5678"
      - "100.121.34.76:5678:5678"
    networks:
      stack-network:
        aliases:
          - n8n-web
      proxy-network:
        aliases:
          - n8n-web
      # CAMBIO CLAVE: Usamos node para verificar salud en el puerto interno real
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz/readiness', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
