services:
  n8n-worker:
    image: n8nio/n8n:latest
    restart: always
    command: worker --concurrency=4
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      EXECUTIONS_MODE: ${EXECUTIONS_MODE:-queue}
      # --- CONEXIÓN AL LENOVO (IP Tailscale) ---
      QUEUE_BULL_REDIS_HOST: ${QUEUE_BULL_REDIS_HOST}
      QUEUE_BULL_REDIS_PORT: ${QUEUE_BULL_REDIS_PORT:-6379}
      QUEUE_BULL_REDIS_PASSWORD: ${QUEUE_BULL_REDIS_PASSWORD}
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-5}

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}


      # --- SEGURIDAD ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODE_ENV: production
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      N8N_TRUST_PROXY: ${N8N_TRUST_PROXY:-true}

      # --- VAULT Y S3 ---
      N8N_EXTERNAL_SECRETS_DEFAULT_PROVIDER: ${N8N_EXTERNAL_SECRETS_DEFAULT_PROVIDER}
      N8N_VAULT_SERVER_URL: ${N8N_VAULT_SERVER_URL}
      N8N_VAULT_AUTH_ROLE_ID: ${N8N_VAULT_AUTH_ROLE_ID}
      N8N_VAULT_AUTH_SECRET_ID: ${N8N_VAULT_AUTH_SECRET_ID}
      N8N_VAULT_AUTH_PATH: ${N8N_VAULT_AUTH_PATH}
      N8N_S3_ADDRESS: ${N8N_S3_ADDRESS}
      N8N_S3_PORT: ${N8N_S3_PORT}
      N8N_S3_BUCKET_NAME: ${N8N_S3_BUCKET_NAME}
      N8N_S3_ACCESS_KEY: ${N8N_S3_ACCESS_KEY}
      N8N_S3_SECRET_KEY: ${N8N_S3_SECRET_KEY}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1048M

networks:
  stack-network:
    external: true
  proxy-network:
    external: true
