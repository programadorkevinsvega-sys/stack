# ===============================================
# Nginx Configuration for n8n Reverse Proxy
# ===============================================
# Este archivo actúa como puerta de entrada única
# a toda la infraestructura n8n internamente

upstream n8n_web {
    # Conecta a n8n-web en la red stack-network
    server n8n-web:5678;
}

# Redireccionador HTTP → HTTPS (opcional)
# Descomentar si tienes certificados SSL configurados
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$server_name$request_uri;
# }

# ===============================================
# Servidor HTTP (por defecto)
# ===============================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    # Tamaño máximo de body (para uploads en n8n)
    client_max_body_size 50M;
    
    # Logs
    access_log /var/log/nginx/n8n_access.log;
    error_log /var/log/nginx/n8n_error.log;
    
    # ===============================================
    # Proxy hacia n8n-web
    # ===============================================
    location / {
        # Proxy principal
        proxy_pass http://n8n_web;
        proxy_http_version 1.1;
        
        # Headers necesarios para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers de información del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
        
        # Buffers
        proxy_buffering off;
    }
    
    # ===============================================
    # Health Check
    # ===============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ===============================================
    # Status (local solo)
    # ===============================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;      # Docker networks
        deny all;
    }
}

