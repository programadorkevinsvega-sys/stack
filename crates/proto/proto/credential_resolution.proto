syntax = "proto3";

package ai_gateway.credentials.v1;

// Servicio de resolución de credenciales AWS.
// Gestiona el ciclo de vida de STS tokens y health checks.
service CredentialResolutionService {
    // Obtiene credenciales STS vigentes para una cuenta (cache + refresh).
    rpc GetCredentials(GetCredentialsRequest) returns (GetCredentialsResponse);

    // Health check de una cuenta específica.
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc ListModelsForAccount(ListModelsForAccountRequest) returns (ListModelsForAccountResponse);
    rpc ListHealthyAccountsForModel(ListHealthyAccountsForModelRequest) returns (ListHealthyAccountsForModelResponse);
    rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
    rpc GetMantleConnection(GetMantleConnectionRequest) returns (GetMantleConnectionResponse);
    rpc UpsertMantleConnection(UpsertMantleConnectionRequest) returns (UpsertMantleConnectionResponse);
}

message GetCredentialsRequest {
    string account_id = 1; // UUID de la cuenta en el pool
}

message GetCredentialsResponse {
    string access_key_id = 1;
    string secret_access_key = 2;
    string session_token = 3;
    string expires_at = 4;   // ISO 8601
    string region = 5;
}

message HealthCheckRequest {
    string account_id = 1;
}

message HealthCheckResponse {
    bool is_healthy = 1;
    int32 consecutive_errors = 2;
    string last_error = 3;
}

message ListModelsForAccountRequest { string account_id = 1; }
message ListModelsForAccountResponse { repeated string model_catalog_ids = 1; }

message HealthyAccount {
    string account_id = 1;
    string aws_account_id = 2;
    string region = 3;
    int32 max_tpm = 4;
    int32 max_rpm = 5;
    int32 priority_weight = 6;
}

message ListHealthyAccountsForModelRequest { string model_catalog_id = 1; }
message ListHealthyAccountsForModelResponse { repeated HealthyAccount accounts = 1; }

message ListAccountsRequest {}

message AccountSummary {
    string account_id = 1;
    string account_alias = 2;
    string aws_account_id = 3;
    string region = 4;
    string auth_method = 5;
    bool is_healthy = 6;
    bool is_active = 7;
}

message ListAccountsResponse { repeated AccountSummary accounts = 1; }

message GetMantleConnectionRequest {
    string account_id = 1;
    string model_catalog_id = 2;
}

message GetMantleConnectionResponse {
    bool configured = 1;
    optional string api_key = 2;
    string base_url = 3;
    optional string expires_at = 4;
}

message UpsertMantleConnectionRequest {
    string account_id = 1;
    string model_catalog_id = 2;
    string api_key = 3;
    string base_url = 4;
    optional string expires_at = 5;
    string admin_actor_id = 6;
    optional string client_ip = 7;
}

message UpsertMantleConnectionResponse {
    string account_id = 1;
    string model_catalog_id = 2;
    string base_url = 3;
    optional string expires_at = 4;
    bool configured = 5;
}
