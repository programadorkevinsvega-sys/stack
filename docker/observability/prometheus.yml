global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/s3-gateway.yml

scrape_configs:
  - job_name: s3-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4002"]
        labels:
          service: s3-gateway
          environment: local

  - job_name: file-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          service: file-service
          environment: local

  - job_name: nats
    metrics_path: /metrics
    static_configs:
      - targets: ["nats-exporter:7777"]
        labels:
          service: nats
          environment: local
