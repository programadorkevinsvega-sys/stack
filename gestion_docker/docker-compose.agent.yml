services:
  portainer_agent:
    image: portainer/agent:latest
    container_name: portainer_agent
    restart: always

    ports:
      - "127.0.0.1:9001:9001"
      - "100.121.34.76:9001:9001"

    environment:
      TZ: ${TZ:-America/Bogota}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      AGENT_SECRET: ${AGENT_SECRET}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

    networks:
      - portainer-agent-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  portainer-agent-net:
    driver: bridge
