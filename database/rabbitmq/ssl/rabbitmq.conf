# RabbitMQ Configuration File
# Generated for TLS 1.3 support

# Network and protocol
listeners.ssl.default = 5671
listeners.tcp = none

# TLS/SSL Configuration
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.certfile = /etc/rabbitmq/ssl/server.crt
ssl_options.keyfile = /etc/rabbitmq/ssl/server.key
ssl_options.cacertfile = /etc/rabbitmq/ssl/root.crt

# TLS 1.3 Only
ssl_options.versions.1 = tlsv1.3
ssl_options.honor_cipher_order = true

# Management Plugin (sin TLS, solo localhost)
# El management es interno, no necesita TLS externo
management.listener.port = 15672

# Allow plaintext on localhost for testing
listeners.ssl.1 = 5671
listeners.tcp.1 = 127.0.0.1:5672
listeners.tcp.2 = 100.121.34.76:5672

# Clustering
cluster_partition_handling = autoheal
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Memory limits
vm_memory_high_watermark.relative = 0.6

# Performance
channel_max = 2048
connection_max = 50000
heartbeat = 60
