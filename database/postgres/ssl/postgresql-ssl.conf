# Configuración TLS 1.3 para PostgreSQL

# Habilitar TLS
ssl = on

# SOLO TLS 1.3 (deshabilitar SSL y versiones antiguas)
ssl_min_protocol_version = 'TLSv1.3'
ssl_max_protocol_version = 'TLSv1.3'

# Rutas de los certificados
ssl_cert_file = '/ssl/postgres/server.crt'
ssl_key_file = '/ssl/postgres/server.key'

# Ciphers seguros para TLS 1.3
ssl_ciphers = 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256'
ssl_prefer_server_ciphers = on
