# Supabase Docker Compose - Configuración Oficial Completa
# Incluye todas las funcionalidades de Supabase

services:
  # Supabase Studio - Dashboard de administración
  studio:
    container_name: supabase-studio
    image: supabase/studio:latest
    restart: always
    ports:
      - "100.121.34.76:3000:3000"
      - "127.0.0.1:3000:3000"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/supabase
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: supabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SNIPPETS_MANAGEMENT_FOLDER: /home/deno/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /home/deno/functions
    depends_on:
      - kong
    volumes:
      - ./docker/studio.env:/app/apps/studio/.env
      - ./snippets:/home/deno/snippets
      - ./functions:/home/deno/functions
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://$(hostname):3000/').then(r => { if (r.status >= 200 && r.status < 500) process.exit(0); process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stack-network

  # Kong API Gateway
  kong:
    container_name: supabase-kong
    image: kong:2.8.1
    restart: always
    ports:
      - "100.121.34.76:8000:8000"
      - "100.121.34.76:8443:8443"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - ./docker/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - stack-network

  # PostgREST API
  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v11.2.0
    restart: always
    ports:
      - "100.121.34.76:3001:3000"
      - "127.0.0.1:3001:3000"
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGRES_PASSWORD}@postgres:5432/supabase
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    networks:
      - stack-network

  # Realtime
  realtime:
    container_name: supabase-realtime
    image: supabase/realtime:v2.25.35
    restart: always
    ports:
      - "100.121.34.76:4000:4000"
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: supabase
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${POSTGRES_PASSWORD}
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    networks:
      - stack-network

  # Storage
  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v0.40.4
    restart: always
    ports:
      - "100.121.34.76:5000:5000"
      - "127.0.0.1:5000:5000"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres:5432/supabase
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      # Configuración para replicación
      STORAGE_REPLICATION_MODE: "master"
      STORAGE_REPLICATION_ENABLED: "false"
    volumes:
      - storage_data:/var/lib/storage
      - ./migrations-override/0001-initialmigration.sql:/app/migrations/tenant/0001-initialmigration.sql
    depends_on:
      - rest
    networks:
      - stack-network

  # Storage Replica (solo si STORAGE_REPLICATION_ENABLED=true)
  storage-replica:
    container_name: supabase-storage-replica
    image: supabase/storage-api:v0.40.4
    restart: always
    ports:
      - "100.121.34.76:5001:5000"
      - "127.0.0.1:5001:5000"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres:5432/supabase
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      # Configuración para replicación
      STORAGE_REPLICATION_MODE: "slave"
      STORAGE_REPLICATION_ENABLED: "true"
      STORAGE_MASTER_HOST: "storage"
      STORAGE_MASTER_PORT: "5000"
      STORAGE_SYNC_INTERVAL: "300"
      STORAGE_BACKUP_ENABLED: "true"
      STORAGE_BACKUP_SCHEDULE: "0 2 * * *"
      STORAGE_BACKUP_RETENTION: "7"
    volumes:
      - storage_replica_data:/var/lib/storage
      - storage_backup_data:/var/lib/storage/backups
    depends_on:
      - storage
    networks:
      - stack-network
    profiles:
      - storage-replication

  # Image Proxy
  imgproxy:
    container_name: supabase-imgproxy
    image: darthsim/imgproxy:v3.8.0
    restart: always
    ports:
      - "100.121.34.76:5001:5001"
      - "127.0.0.1:5001:5001"
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /var/lib/storage
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
    volumes:
      - storage_data:/var/lib/storage:ro
    networks:
      - stack-network

  # Auth
  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.99.0
    restart: always
    ports:
      - "100.121.34.76:9999:9999"
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${POSTGRES_PASSWORD}@postgres:5432/supabase
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-true}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-false}
    networks:
      - stack-network

  # Functions
  functions:
    container_name: supabase-functions
    image: supabase/edge-runtime:v1.30.0
    restart: always
    command: ["start", "--main-service", "/home/deno/functions"]
    ports:
      - "100.121.34.76:8001:8000"
      - "127.0.0.1:8001:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/supabase
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT:-false}
    volumes:
      - ./functions:/home/deno/functions
    networks:
      - stack-network
  # Postgres Meta - Esquemas y tablas
  meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.96.5
    restart: always
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: supabase
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_SSL: "false"
      PG_META_CONNECTION_DB_HOST: postgres
      PG_META_CONNECTION_DB_PORT: 5432
      PG_META_CONNECTION_DB_NAME: supabase
      PG_META_CONNECTION_DB_USER: supabase_admin
      PG_META_CONNECTION_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CONNECTION_DB_SSL: "false"
    networks:
      - stack-network

volumes:
  storage_data:
    driver: local
  storage_replica_data:
    driver: local
  storage_backup_data:
    driver: local

networks:
  stack-network:
    name: stack-network
    driver: bridge
