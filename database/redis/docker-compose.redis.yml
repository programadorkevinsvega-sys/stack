  redisinsight:
    image: redis/redisinsight:latest
    restart: always # Reinicia automáticamente, incluso después de reboot
    environment:
      REDIS_INSIGHT_USERNAME: ${REDIS_INSIGHT_USERNAME:-KevinsAdmin}
      REDIS_INSIGHT_PASSWORD: ${REDIS_INSIGHT_PASSWORD:-Kevins1612522026}
      # IMPORTANTE para Cloudflare, confía en los headers de proxy para IP real y protocolo
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
    ports:
      - "100.121.34.76:5540:5540"
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis
    networks:
      - stack-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
# ================================
# 🌐 RED COMPARTIDA
# ================================
