# ============================================================================
# NATS JetStream compartido para la plataforma
# ============================================================================
#
# Este archivo es una referencia humana del baseline esperado.
# El contenedor genera la configuración efectiva en runtime desde variables
# de entorno usando `script/start-nats.sh`, porque NATS no interpola de forma
# suficientemente flexible toda la política que necesitamos aquí.
#
# Los parámetros que hoy son variables operativas reales son:
#
# - NATS_SERVER_NAME
# - NATS_PORT
# - NATS_HTTP_PORT
# - NATS_USERNAME
# - NATS_PASSWORD
# - NATS_TLS_ENABLED
# - NATS_TLS_CERT_FILE
# - NATS_TLS_KEY_FILE
# - NATS_TLS_CA_FILE
# - NATS_MAX_PAYLOAD
# - NATS_MAX_PENDING
# - NATS_WRITE_DEADLINE
# - NATS_PING_INTERVAL
# - NATS_PING_MAX
# - NATS_MAX_CONNECTIONS
# - NATS_MAX_SUBSCRIPTIONS
# - NATS_JETSTREAM_STORE_DIR
# - NATS_JETSTREAM_MAX_MEMORY_STORE
# - NATS_JETSTREAM_MAX_FILE_STORE
# - NATS_JETSTREAM_SYNC_INTERVAL
#
# La retención por tiempo de los streams se controla desde las aplicaciones
# consumidoras/productoras porque JetStream la define por stream, no como una
# política global del servidor.
#
# Mira `stack/database/nats/.env.example` y `script/start-nats.sh`.
