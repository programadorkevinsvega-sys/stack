# 🗄️ SERVICIOS EXTERNOS PARA n8n
# ================================
# Este docker-compose.kafka.yml levanta el servicio EXTERNO que n8n necesita:
# - Kafka: Message broker (cola de trabajos para workers distribuidos)
#
# Estos servicios son COMPARTIDOS por:
# - PC Local (docker-compose.yml)
# - VPS Remoto (vps/docker-compose.vps.yml)
#
# ⚠️ IMPORTANTE: Levanta ESTO PRIMERO, antes de levantarn8n en PC o VPS

services:

  # ================================
  # 📨 Kafka - Message Broker
  # ================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always # Reinicia SIEMPRE, incluso después de reboot

    # Variables de entorno para KRaft (sin Zookeeper)
    environment:
      CLUSTER_ID: ${CLUSTER_ID:-Y3DSouUUQSeA1NGM3Og3bA}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SSL://0.0.0.0:9094}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-INTERNAL://kafka:29092,EXTERNAL://100.121.34.76:9092,SSL://100.121.34.76:9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,SSL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NUM_NETWORK_THREADS:-8}
      KAFKA_NUM_IO_THREADS: ${KAFKA_NUM_IO_THREADS:-8}
      KAFKA_SOCKET_SEND_BUFFER_BYTES: ${KAFKA_SOCKET_SEND_BUFFER_BYTES:-102400}
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: ${KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:-102400}
      KAFKA_SOCKET_REQUEST_MAX_BYTES: ${KAFKA_SOCKET_REQUEST_MAX_BYTES:-104857600}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:-snappy}
      # SSL Configuration (optional, can be disabled with KAFKA_ENABLE_SSL=false)
      KAFKA_ENABLE_SSL: ${KAFKA_ENABLE_SSL:-false}
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/keystore.p12
      KAFKA_SSL_KEYSTORE_FILENAME: keystore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD:-Kevins1612522026}
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-credentials
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEY_CREDENTIALS: keystore-credentials
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TRUSTSTORE_PASSWORD:-Kevins1612522026}
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore-credentials
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12

      # IMPORTANTE para Cloudflare, confía en los headers de proxy para IP real y protocolo
      TZ: ${TZ:-America/Bogota}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}

    # Datos persistentes (en carpeta ./volumes/)
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./ssl/generales:/etc/kafka/secrets:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Puertos
    # 9092: EXTERNAL PLAINTEXT (clientes Tailscale)
    # 29092: INTERNAL PLAINTEXT (servicios dentro del compose)
    # 9094: SSL (cifrado)
    # 9093: CONTROLLER (interno, solo localhost)
    ports:
      - "127.0.0.1:9092:9092"
      - "100.121.34.76:9092:9092"
      - "127.0.0.1:29092:29092"
      - "127.0.0.1:9094:9094"
      - "100.121.34.76:9094:9094"
      - "127.0.0.1:9093:9093"

    # Healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:29092" ]
      interval: 10s
      timeout: 5s
      retries: 5

    # Red
    networks:
      - stack-network

    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Limites de recursos (12GB VPS independiente)
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 2G

# ================================
# 🌐 RED COMPARTIDA
# ================================
networks:
  stack-network:
    name: stack-network
    driver: bridge

volumes:
  kafka_data:
